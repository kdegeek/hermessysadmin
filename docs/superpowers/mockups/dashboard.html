<title>AD Dashboard Mockup</title>
<style>
/* Approximates Hermes Desktop --ui-* tokens (apps/desktop/src/styles.css). The real plugin uses the host's vars. */
:root{
  --ui-base:#1d1d1f; --ui-accent:#6b5bd2;
  --ui-red:#cf2d56; --ui-orange:#db704b; --ui-yellow:#c08532; --ui-green:#1f8a65; --ui-blue:#0053fd;
  --ui-bg-chrome:#f3f2f0; --ui-bg-sidebar:#ecebe8; --ui-bg-editor:#fbfbfa; --ui-bg-elevated:#ffffff;
  --ui-bg-card:color-mix(in srgb,var(--ui-accent) 4%,color-mix(in srgb,var(--ui-base) 4%,transparent));
  --ui-bg-input:#fcfcfc;
  --ui-row-hover-background:color-mix(in srgb,var(--ui-base) 4%,transparent);
  --ui-row-active-background:color-mix(in srgb,var(--ui-accent) 10%,transparent);
  --ui-text-primary:color-mix(in srgb,var(--ui-base) 94%,transparent);
  --ui-text-secondary:color-mix(in srgb,var(--ui-base) 74%,transparent);
  --ui-text-tertiary:color-mix(in srgb,var(--ui-base) 54%,transparent);
  --ui-text-quaternary:color-mix(in srgb,var(--ui-base) 36%,transparent);
  --ui-stroke-secondary:color-mix(in srgb,var(--ui-base) 12%,transparent);
  --ui-stroke-tertiary:color-mix(in srgb,var(--ui-base) 8%,transparent);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ui-base:#ecebe8; --ui-accent:#9e94d5; --ui-red:#e75e78; --ui-green:#55a583;
    --ui-bg-chrome:#161618; --ui-bg-sidebar:#1b1b1e; --ui-bg-editor:#1f1f22; --ui-bg-elevated:#26262a; --ui-bg-input:#1a1a1d;
  }
}
:root[data-theme="dark"]{
  --ui-base:#ecebe8; --ui-accent:#9e94d5; --ui-red:#e75e78; --ui-green:#55a583;
  --ui-bg-chrome:#161618; --ui-bg-sidebar:#1b1b1e; --ui-bg-editor:#1f1f22; --ui-bg-elevated:#26262a; --ui-bg-input:#1a1a1d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ui-bg-chrome);color:var(--ui-text-primary);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 26px;height:100vh}
/* host chrome */
.side{background:var(--ui-bg-sidebar);border-right:1px solid var(--ui-stroke-tertiary);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.side .brand{font-weight:600;padding:4px 8px 12px;color:var(--ui-text-secondary)}
.nav{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--ui-text-secondary);cursor:default}
.nav.host{opacity:.55}
.nav.active{background:var(--ui-row-active-background);color:var(--ui-text-primary)}
.nav .ico{width:16px;text-align:center}
.side .sep{height:1px;background:var(--ui-stroke-tertiary);margin:8px}
.side .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ui-text-quaternary);padding:4px 8px}
.main{background:var(--ui-bg-editor);overflow:auto;position:relative}
.status{grid-column:1/3;background:var(--ui-bg-chrome);border-top:1px solid var(--ui-stroke-tertiary);display:flex;align-items:center;gap:16px;padding:0 10px;font-size:11.5px;color:var(--ui-text-tertiary)}
.status .mine{display:flex;align-items:center;gap:6px;color:var(--ui-text-secondary);padding:0 6px;border-radius:4px}
.status .mine:hover{background:var(--ui-row-hover-background)}
.status .right{margin-left:auto}
/* plugin page */
.page{padding:18px 22px 40px;max-width:1280px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.head h1{font-size:17px;margin:0;font-weight:600}
.head .domain{color:var(--ui-text-tertiary)}
.head .grow{flex:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--ui-stroke-secondary);margin-bottom:16px;overflow-x:auto}
.tab{padding:7px 12px;border:0;background:none;color:var(--ui-text-tertiary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ui-text-primary);border-bottom-color:var(--ui-accent)}
.tab .n{font-size:11px;margin-left:4px;padding:0 5px;border-radius:8px;background:var(--ui-bg-card);color:var(--ui-text-tertiary)}
.btn{border:1px solid var(--ui-stroke-secondary);background:var(--ui-bg-elevated);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--ui-row-hover-background)}
.btn.primary{background:var(--ui-accent);border-color:transparent;color:#fff}
.btn.danger{color:var(--ui-red)}
.btn.danger.solid{background:var(--ui-red);color:#fff;border-color:transparent}
.btn.sm{padding:2px 8px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.ghost{border:0;background:none;color:var(--ui-text-tertiary);cursor:pointer;padding:2px 6px;border-radius:4px}
.ghost:hover{background:var(--ui-row-hover-background);color:var(--ui-text-primary)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.g{background:var(--ui-green)}.y{background:var(--ui-yellow)}.r{background:var(--ui-red)}.n{background:var(--ui-text-quaternary)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--ui-bg-card);color:var(--ui-text-secondary);border:1px solid var(--ui-stroke-tertiary);white-space:nowrap}
.badge.red{color:var(--ui-red);border-color:color-mix(in srgb,var(--ui-red) 30%,transparent);background:color-mix(in srgb,var(--ui-red) 8%,transparent)}
.badge.yellow{color:var(--ui-yellow);border-color:color-mix(in srgb,var(--ui-yellow) 30%,transparent);background:color-mix(in srgb,var(--ui-yellow) 8%,transparent)}
.badge.green{color:var(--ui-green);border-color:color-mix(in srgb,var(--ui-green) 30%,transparent);background:color-mix(in srgb,var(--ui-green) 8%,transparent)}
.badge.accent{color:var(--ui-accent);border-color:color-mix(in srgb,var(--ui-accent) 30%,transparent);background:color-mix(in srgb,var(--ui-accent) 8%,transparent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--ui-bg-card);border:1px solid var(--ui-stroke-tertiary);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--ui-stroke-secondary)}
.kpi .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--ui-text-tertiary);font-size:12px}
.kpi .s{font-size:11.5px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{display:none}.status{grid-column:1}}
.card{background:var(--ui-bg-card);border:1px solid var(--ui-stroke-tertiary);border-radius:8px;overflow:hidden}
.card h3{margin:0;font-size:12.5px;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--ui-stroke-tertiary);display:flex;align-items:center;gap:8px}
.card h3 .sub{font-weight:400;color:var(--ui-text-tertiary)}
.card h3 .grow{flex:1}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--ui-text-tertiary);font-size:11.5px;text-align:left;padding:6px 12px;border-bottom:1px solid var(--ui-stroke-tertiary);white-space:nowrap}
td{padding:7px 12px;border-bottom:1px solid var(--ui-stroke-tertiary);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--ui-row-hover-background)}
tbody tr.sel{background:var(--ui-row-active-background)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.muted{color:var(--ui-text-tertiary)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.search{flex:0 1 300px;border:1px solid var(--ui-stroke-secondary);background:var(--ui-bg-input);border-radius:6px;padding:5px 10px;color:var(--ui-text-primary)}
.chip{border:1px solid var(--ui-stroke-secondary);background:none;border-radius:12px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--ui-text-secondary)}
.chip.on{background:var(--ui-row-active-background);border-color:color-mix(in srgb,var(--ui-accent) 40%,transparent);color:var(--ui-text-primary)}
.grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--ui-stroke-secondary);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:3px 10px;cursor:pointer;color:var(--ui-text-tertiary)}
.seg button.on{background:var(--ui-row-active-background);color:var(--ui-text-primary)}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:26px;width:420px;max-width:100vw;background:var(--ui-bg-elevated);border-left:1px solid var(--ui-stroke-secondary);box-shadow:-12px 0 30px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .18s;overflow:auto;z-index:20}
.drawer.open{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--ui-stroke-tertiary);position:sticky;top:0;background:var(--ui-bg-elevated)}
.avatar{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--ui-accent) 20%,transparent);display:grid;place-items:center;font-weight:600;color:var(--ui-accent)}
.drawer .sec{padding:12px 16px;border-bottom:1px solid var(--ui-stroke-tertiary)}
.drawer .sec h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ui-text-quaternary);font-weight:500}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:12.5px}
.kv .k{color:var(--ui-text-tertiary)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.callout{border-radius:6px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.callout.red{background:color-mix(in srgb,var(--ui-red) 9%,transparent);border:1px solid color-mix(in srgb,var(--ui-red) 25%,transparent)}
.callout.yellow{background:color-mix(in srgb,var(--ui-yellow) 9%,transparent);border:1px solid color-mix(in srgb,var(--ui-yellow) 25%,transparent)}
.callout.accent{background:color-mix(in srgb,var(--ui-accent) 8%,transparent);border:1px solid color-mix(in srgb,var(--ui-accent) 25%,transparent)}
/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.scrim.open{display:flex}
.dialog{background:var(--ui-bg-elevated);border:1px solid var(--ui-stroke-secondary);border-radius:10px;width:480px;max-width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog .b{padding:16px 18px}
.dialog h2{font-size:15px;margin:0 0 6px}
.dialog .f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--ui-stroke-tertiary)}
.whatif{background:var(--ui-bg-chrome);border:1px solid var(--ui-stroke-tertiary);border-radius:6px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:pre-wrap;margin:10px 0;color:var(--ui-text-secondary)}
.input{width:100%;border:1px solid var(--ui-stroke-secondary);background:var(--ui-bg-input);border-radius:6px;padding:6px 10px;color:var(--ui-text-primary);font:inherit}
.tier{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:4px}
.tier.R{background:var(--ui-bg-card);color:var(--ui-text-tertiary)}
.tier.W{background:color-mix(in srgb,var(--ui-yellow) 14%,transparent);color:var(--ui-yellow)}
.tier.H{background:color-mix(in srgb,var(--ui-red) 14%,transparent);color:var(--ui-red)}
.tier.P{background:var(--ui-text-primary);color:var(--ui-bg-editor)}
/* backups */
.hosts{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.hcard{background:var(--ui-bg-card);border:1px solid var(--ui-stroke-tertiary);border-radius:8px;padding:12px}
.hcard.bad{border-color:color-mix(in srgb,var(--ui-red) 40%,transparent)}
.hcard.warn{border-color:color-mix(in srgb,var(--ui-yellow) 40%,transparent)}
.hcard .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hcard .top b{flex:1}
.bar{height:6px;border-radius:3px;background:var(--ui-stroke-tertiary);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ui-accent)}
.toggle{width:30px;height:17px;border-radius:9px;background:var(--ui-stroke-secondary);position:relative;border:0;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--ui-green)}
.toggle.on::after{left:15px}
.empty{max-width:440px;margin:60px auto;text-align:center}
.empty .big{font-size:34px;margin-bottom:8px}
.form{display:grid;gap:10px;text-align:left;margin-top:16px}
.form label{font-size:12px;color:var(--ui-text-tertiary);display:grid;gap:4px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ui-text-primary);color:var(--ui-bg-editor);padding:8px 14px;border-radius:8px;transition:.2s;z-index:60;font-size:12.5px}
.toast.show{opacity:1;transform:translateX(-50%)}
.mockbar{position:fixed;top:8px;right:10px;z-index:70;display:flex;gap:6px;align-items:center;background:var(--ui-bg-elevated);border:1px dashed var(--ui-accent);border-radius:8px;padding:4px 8px;font-size:11.5px}
.mockbar b{color:var(--ui-accent)}
/* chat approval mock */
.chat{max-width:640px;margin:0 auto}
.msg{padding:10px 0}
.msg.user .bub{background:color-mix(in srgb,var(--ui-base) 6%,transparent);border-radius:10px;padding:8px 12px;display:inline-block}
.toolcall{border:1px solid var(--ui-stroke-tertiary);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:12px;display:flex;gap:8px;align-items:center;color:var(--ui-text-secondary)}
.approve{border:1px solid color-mix(in srgb,var(--ui-red) 35%,transparent);border-radius:10px;overflow:hidden;margin:8px 0}
.approve .ah{background:color-mix(in srgb,var(--ui-red) 8%,transparent);padding:8px 12px;display:flex;gap:8px;align-items:center;font-weight:600}
.approve .ab{padding:10px 12px}
.approve .af{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--ui-stroke-tertiary);flex-wrap:wrap}
</style>
</head>

function act(u,label,tier,dis){
  const blocked=u.protected;
  const on=blocked||dis?"disabled":"";
  const cls=tier==="H"?"btn sm danger":"btn sm";
  const fn=label==="Delete"?`confirmH('Delete user','${u.sam}','Remove-ADUser -Identity ${u.sam} -WhatIf\\nWhat if: Performing the operation \\"Remove\\" on target \\"CN=${u.name},OU=${u.ou.split("/").reverse().join(",OU=")},DC=corp,DC=example,DC=local\\".\\nRecycle Bin: enabled — restorable for 180 days.','ad_user_delete')`
   :label==="Unlock"?`unlock('${u.sam}')`
   :label==="Reset password"?`resetPwd('${u.sam}')`
   :label==="Add to group…"?`addGroup('${u.sam}')`
   :`confirmW('${label} ${u.sam}','${label} ${u.sam}?','ad_user_${label.toLowerCase().replace(/[^a-z]/g,"")}')`;
  return `<button class="${cls}" ${on} onclick="${fn}" title="${blocked?"Blocked: protected object":tier+"-tier"}">${label}</button>`;
}

  <div class="card"><table><thead><tr><th>User</th><th>Host</th><th>ID</th><th>State</th><th>Idle</th><th>Logon</th><th></th></tr></thead><tbody>
  ${sessions.map(s=>`<tr><td><b class="mono">${s.user}</b>${s.flag?`<div><span class="badge red">${s.flag}</span></div>`:""}</td><td class="mono">${s.host}</td><td class="muted">${s.id}</td><td><span class="dot ${s.state==="Active"?"g":"y"}"></span> ${s.state}</td><td class="muted">${s.idle}</td><td class="muted">${s.logon}</td>
   <td style="white-space:nowrap"><button class="btn sm" onclick="toast('Message dialog')">Message</button> <button class="btn sm" onclick="confirmW('Disconnect session','Disconnect ${s.user} on ${s.host}?','rdp_session_disconnect')">Disconnect</button> <button class="btn sm danger" onclick="confirmW('Log off session','Log off ${s.user} from ${s.host} (session ${s.id})? Unsaved work will be lost.','rdp_session_logoff')">Log off</button> <button class="btn sm" onclick="toast('Opening ${s.host}.rdp…')">Connect ↗</button></td></tr>`).join("")}
  </tbody></table></div>
  <div class="callout yellow" style="margin-top:10px">⚠ <div>SRV-LEGACY01, SRV-PRINT02 unreachable over WinRM from DC01. <button class="ghost">Details</button></div></div>`;
}

function backupsTab(){
  return `<div class="toolbar"><span class="muted">Windows Server Backup · stale threshold: system state older than 7 days</span><span class="grow"></span><button class="btn" onclick="toast('Refreshed backup status')">↻ Refresh</button></div>
  <div class="hosts">${backups.map(b=>`<div class="hcard ${b.state==="bad"?"bad":b.state==="none"?"warn":""}">
   <div class="top"><span class="dot ${b.state==="ok"?"g":b.state==="bad"?"r":b.state==="run"?"y":"n"}"></span><b>${b.host}</b>${b.state==="run"?'<span class="badge accent">running</span>':b.state==="bad"?'<span class="badge red">stale</span>':b.state==="none"?'<span class="badge">not configured</span>':'<span class="badge green">ok</span>'}</div>
   ${b.err?`<div class="callout ${b.state==="bad"?"red":"yellow"}" style="margin-bottom:8px;font-size:12px">${b.err}</div>`:""}
   ${b.state==="run"?`<div class="bar"><i style="width:${b.prog}%"></i></div><div class="muted" style="font-size:12px">System state · ${b.prog}% · ~6 min left</div>`:""}
   <div class="kv" style="grid-template-columns:110px 1fr;font-size:12px">
    <span class="k">Last success</span><span>${b.last}</span><span class="k">System state</span><span style="${b.state==="bad"?"color:var(--ui-red)":""}">${b.ss}${b.ssAge!=="—"?` (${b.ssAge})`:""}</span>
    <span class="k">Next run</span><span>${b.next}</span><span class="k">Target</span><span class="mono" style="font-size:11.5px">${b.target}</span><span class="k">Versions</span><span>${b.versions}</span></div>
   <div class="actions" style="margin-top:10px">${b.state==="run"?`<button class="btn sm danger" onclick="confirmW('Cancel backup','Cancel the running backup on ${b.host}?','backup_cancel')">Cancel</button>`:b.state==="none"?`<button class="btn sm" disabled>Back up now</button><span class="muted" style="font-size:11.5px">Install feature first</span>`:`<button class="btn sm primary" onclick="backupNow('${b.host}')">Back up now</button>`}<button class="btn sm" ${b.versions?"":"disabled"}>Versions</button><button class="btn sm danger" ${b.state==="none"?"disabled":""} onclick="confirmH('Change backup policy','${b.host}','Set-WBPolicy -Policy … -WhatIf\\nSchedule: 02:00 → 23:00\\nTarget: E: (USB) → \\\\\\\\NAS01\\\\wsb\\\\FS01','backup_set_policy')">Policy…</button></div>
  </div>`).join("")}</div>`;
}
function backupNow(h){dialog(`<div class="b"><h2>Back up ${h} now</h2>${tierTag("W")}<div class="form"><div class="seg"><button class="on">System state</button><button>Full (policy)</button><button>Volumes…</button></div><label>Target<input class="input mono" value="\\\\NAS01\\wsb\\${h}"></label><div class="muted" style="font-size:12px">Runs as a server-side job. Progress is polled and shown here; you can close this page.</div></div></div><div class="f"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="startBk('${h}')">Start backup</button></div>`)}
function startBk(h){const b=backups.find(x=>x.host===h);b.state="run";b.prog=3;b.err=null;closeDlg();toast(`Backup started on ${h}`);render();const iv=setInterval(()=>{b.prog=Math.min(100,b.prog+9);if(b.prog>=100){clearInterval(iv);b.state="ok";b.ss="Just now";b.ssAge="0 m";b.last="Just now";b.versions++;toast(`${h}: system-state backup complete`)}if(state.tab==="backups")render()},700)}

function auditTab(){
  return `<div class="toolbar"><input class="search" placeholder="Search tool, target, actor…"><button class="chip">Agent</button><button class="chip">Dashboard</button><button class="chip">Denied / blocked</button><button class="chip">Failed</button><span class="grow"></span><button class="btn">Export CSV</button></div>
  <div class="card"><table><thead><tr><th>Time</th><th>Actor</th><th>Tier</th><th>Action</th><th>Target</th><th>Decision / result</th></tr></thead><tbody>
  ${audit.map(a=>`<tr class="click"><td class="mono muted">${a.t}</td><td>${a.actor}</td><td>${tierTag(a.tier)}</td><td class="mono">${a.tool}</td><td>${esc(a.target)}</td><td>${decBadge(a)}</td></tr>`).join("")}
  </tbody></table></div><p class="muted" style="font-size:12px">Passwords and secret parameters are redacted before storage. Stored locally in the plugin's SQLite database.</p>`;
}

function setup(){
  return `<div class="empty"><div class="big">🏢</div><h2 style="margin:0 0 6px;font-size:17px">Connect to Active Directory</h2>
   <p class="muted">Hermes reaches your domain through one WinRM jump host, a domain controller or a server with RSAT installed. Credentials are stored in Hermes secrets.</p>
   <div class="form"><label>Jump host<input class="input mono" placeholder="dc01.corp.example.local"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label>Transport<select class="input"><option>HTTPS · 5986</option><option>HTTP · 5985 (encrypted)</option></select></label><label>Auth<select class="input"><option>NTLM</option><option>Kerberos</option></select></label></div>
    <label>Username<input class="input mono" placeholder="CORP\\svc-hermes"></label><label>Password<input class="input" type="password" placeholder="••••••••"></label>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn">Open plugin settings</button><button class="btn primary" onclick="testConn()">Test connection</button></div>
    <div id="testRes"></div></div></div>`;
}
function testConn(){$("#testRes").innerHTML=`<div class="callout accent">✓ <div>Connected to <b>DC01</b> · Windows Server 2022 · domain corp.example.local<br>ActiveDirectory module ✓ · GroupPolicy module ✓ · WindowsServerBackup on 3/5 servers<br><span class="muted">Delegated rights: user write in OU=Staff ✓ · GPO link in OU=Staff ✓ · Domain Admin ✗ (recommended)</span></div></div>`}

function chat(){
  return `<div class="page"><div class="chat">
   <p class="muted" style="font-size:12px;text-align:center">This is Hermes's own chat UI. The plugin's <span class="mono">pre_tool_call</span> hook supplies the approval message and WhatIf preview.</p>
   <div class="msg user"><div class="bub">Bob says he's locked out again, figure out why and fix it.</div></div>
   <div class="msg"><div class="toolcall">${tierTag("R")} <span class="mono">ad_user_get</span> bmartinez <span class="grow"></span><span class="badge green">ok · 0.4 s</span></div>
    <div class="toolcall">${tierTag("R")} <span class="mono">ad_lockout_source</span> bmartinez <span class="grow"></span><span class="badge green">SRV-APP02 · 14 events</span></div>
    <div class="toolcall">${tierTag("R")} <span class="mono">rdp_sessions</span> host=SRV-APP02 <span class="grow"></span><span class="badge green">2 sessions</span></div>
    <p>Bob's account is being locked by <b>SRV-APP02</b>. He has a disconnected RDP session there from Oct 30 that keeps retrying his old password. I'll log off that session, then unlock him.</p>
    <div class="approve" style="border-color:color-mix(in srgb,var(--ui-yellow) 40%,transparent)"><div class="ah" style="background:color-mix(in srgb,var(--ui-yellow) 9%,transparent)">${tierTag("W")} Approval required · rdp_session_logoff</div>
     <div class="ab">Log off <b class="mono">bmartinez</b> from <b class="mono">SRV-APP02</b> (session 3, disconnected 6 d 4 h).</div>
     <div class="af"><button class="btn primary sm">Approve once</button><button class="btn sm">Approve for session</button><button class="btn sm danger">Deny</button></div></div>
    <div class="toolcall">${tierTag("W")} <span class="mono">rdp_session_logoff</span> SRV-APP02 #3 <span class="grow"></span><span class="badge green">approved · ok</span></div>
    <div class="toolcall">${tierTag("W")} <span class="mono">ad_user_unlock</span> bmartinez <span class="grow"></span><span class="badge green">approved · ok</span></div>
    <p>Done. Bob is unlocked and the stale session is gone, so it shouldn't happen again. Tell him to sign out of any other machines after his next password change.</p></div>
   <div class="msg user"><div class="bub">Also add Bob to Domain Admins.</div></div>
   <div class="msg"><div class="approve"><div class="ah">${tierTag("H")} High-risk change · ad_group_add_member</div>
     <div class="ab"><b>Privileged group.</b> Adding <b class="mono">bmartinez</b> to <b>Domain Admins</b> grants full control of the domain.
      <div class="whatif">Add-ADGroupMember -Identity "Domain Admins" -Members bmartinez -WhatIf
What if: Performing the operation "Set" on target
"CN=Domain Admins,CN=Users,DC=corp,DC=example,DC=local".
Current members: aokafor, Administrator, svc-deploy</div></div>
     <div class="af"><button class="btn sm">Approve once</button><button class="btn sm danger solid">Deny</button><span class="muted" style="font-size:11.5px;align-self:center">“Always” is unavailable for high-risk tools</span></div></div>
    <div class="toolcall">${tierTag("H")} <span class="mono">ad_group_add_member</span> Domain Admins ← bmartinez <span class="grow"></span><span class="badge red">denied by user</span></div>
    <p>Understood. I didn't make that change. If Bob needs elevated access for a specific task, I can add him to a scoped delegation group instead.</p></div>
  </div></div>`;
}

/* dialogs */
function dialog(html){$("#dialog").innerHTML=html;$("#scrim").classList.add("open")}
function closeDlg(){$("#scrim").classList.remove("open")}
let pending=null;
function confirmW(title,body,tool,fn){pending=fn;dialog(`<div class="b"><h2>${title}</h2>${tierTag("W")} <span class="mono muted" style="font-size:11.5px">${tool}</span><p>${body}</p></div><div class="f"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" onclick="doPending('${tool}')">Confirm</button></div>`)}
function doPending(tool){closeDlg();if(pending){pending();pending=null}else toast(`${tool} · ok · logged to audit`)}
function confirmH(title,name,whatif,tool){dialog(`<div class="b"><h2>${title}</h2>${tierTag("H")} <span class="mono muted" style="font-size:11.5px">${tool}</span>
  <p class="muted" style="font-size:12px;margin:8px 0 0">Preview from the server (-WhatIf). Nothing has changed yet.</p><div class="whatif">${esc(whatif)}</div>
  <label class="muted" style="font-size:12px">Type <b class="mono" style="color:var(--ui-text-primary)">${esc(name)}</b> to confirm</label>
  <input class="input mono" id="tconf" oninput="$('#hgo').disabled=this.value!==${JSON.stringify(name).replace(/"/g,'&quot;')}" style="margin-top:4px"></div>
  <div class="f"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn danger solid" id="hgo" disabled onclick="closeDlg();toast('${tool} · ok · logged to audit')">${title}</button></div>`);setTimeout(()=>$("#tconf")?.focus(),30)}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeDlg()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDlg();closeDrawer()}});

function chip(k){state.chips.has(k)?state.chips.delete(k):state.chips.add(k);render()}
function go(t){state.tab=t;if(t!=="users")$("#drawer").classList.remove("open");render();$("#main").scrollTop=0}
function render(){
  const m=$("#main");
  if(state.mode==="setup"){m.innerHTML=`<div class="page">${setup()}</div>`;return}
  if(state.mode==="chat"){m.innerHTML=chat();return}
  const body={overview,users:usersTab,gpo:gpoTab,rdp:rdpTab,backups:backupsTab,audit:auditTab}[state.tab]();
  m.innerHTML=`<div class="page">${header()}${body}</div>`;
}
document.querySelectorAll("#stateSeg button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#stateSeg button").forEach(x=>x.classList.remove("on"));b.classList.add("on");state.mode=b.dataset.s;$("#drawer").classList.remove("open");render()});
render();
</script>
</body>
</html>
