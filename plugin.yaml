name: hermes-sysadmin
label: "Sysadmin · Active Directory"
version: 0.1.0
manifest_version: 2
description: >-
  Manage an on-prem Active Directory domain over WinRM: users, groups and lockouts, Group Policy,
  RDP sessions and access, and Windows Server Backup. Typed tools with tiered approvals, protected
  objects, a local audit log, workflow skills, /ad commands and a Hermes Desktop dashboard.
author: Nate Crawford
kind: standalone
license: MIT
tags: [active-directory, windows, winrm, group-policy, rdp, backup, sysadmin]
requires_hermes: ">=0.22.2"
python_dependencies:
  - "pypsrp>=0.8.1,<0.9"
provides_tools:
  - ad_connection_test
  - ad_dc_health
  - ad_dc_list
  - ad_domain_overview
  - ad_group_add_member
  - ad_group_get
  - ad_group_list
  - ad_group_remove_member
  - ad_lockout_source
  - ad_powershell
  - ad_recycle_bin_list
  - ad_recycle_bin_restore
  - ad_search
  - ad_user_create
  - ad_user_delete
  - ad_user_disable
  - ad_user_enable
  - ad_user_get
  - ad_user_list
  - ad_user_move
  - ad_user_reset_password
  - ad_user_unlock
  - ad_user_update
  - backup_cancel
  - backup_jobs
  - backup_set_policy
  - backup_start
  - backup_status
  - backup_versions
  - catalog_get
  - catalog_module_install
  - catalog_module_status
  - catalog_run
  - catalog_search
  - fleet_device
  - fleet_history
  - fleet_inventory
  - gpo_backup
  - gpo_backups
  - gpo_create
  - gpo_delete
  - gpo_get
  - gpo_health
  - gpo_link
  - gpo_list
  - gpo_report
  - gpo_restore
  - gpo_rsop
  - gpo_set_link
  - gpo_set_security_filter
  - gpo_set_status
  - gpo_unlink
  - gpo_update_hosts
  - monitoring_disable
  - monitoring_enable
  - monitoring_status
  - rdp_connect_file
  - rdp_host_status
  - rdp_session_disconnect
  - rdp_session_logoff
  - rdp_session_message
  - rdp_sessions
  - rdp_set_enabled
  - rdp_set_nla
  - rdp_users_add
  - rdp_users_remove
  - remote_access_check
  - remote_assist_command
  - remote_sessions
  - remote_shadow_command
  - sysadmin_audit_log
provides_hooks:
  - pre_tool_call
  - post_tool_call
config_schema:
  host:
    type: str
    label: Jump host (domain controller)
    description: FQDN of the domain controller Hermes connects to over WinRM, e.g. dc01.corp.example.local.
    required: true
  port:
    type: int
    label: WinRM port
    description: Leave empty to use 5986 for HTTPS or 5985 for HTTP (traffic is still encrypted with NTLM/Kerberos).
  use_https:
    type: bool
    default: true
    label: Use HTTPS
  auth:
    type: str
    choices: [ntlm, kerberos]
    default: ntlm
    label: Authentication
  username:
    type: str
    label: Username
    description: DOMAIN\user or user@domain. Prefer a delegated admin account over a Domain Admin.
    required: true
  password:
    type: secret
    env: SYSADMIN_WINRM_PASSWORD
    label: Password
    description: Password for the WinRM account. Stored in Hermes secrets, never in config.yaml.
    required: true
  verify_tls:
    type: bool
    default: true
    label: Verify TLS certificate
    description: Turn off only for a lab with a self-signed WinRM certificate.
  server_search_base:
    type: str
    default: ""
    label: Servers OU
    description: Distinguished name of the OU searched when an action targets "all servers". Empty means every Windows Server computer object.
  backup_stale_days:
    type: int
    default: 7
    label: Backup stale after (days)
    description: A system-state backup older than this is flagged red.
  mode:
    type: str
    choices: [strict, permissive, read-only]
    default: strict
    label: Safety mode
    description: strict asks before every write; permissive asks only for high-risk changes; read-only blocks all writes.
  protected_objects:
    type: list
    default: []
    label: Protected objects
    description: Extra accounts or groups that can never be changed (krbtgt and Administrator are always protected).
  privileged_groups:
    type: list
    default: []
    label: Extra privileged groups
    description: Groups treated like Domain Admins; membership changes become high-risk.
  enable_powershell_escape:
    type: bool
    default: false
    label: Enable raw PowerShell tool
    description: Registers ad_powershell, which runs arbitrary PowerShell on the jump host after approval every time.
  monitor_interval:
    type: str
    default: "30m"
    label: Monitoring interval
    description: How often the scheduled watch runs, as a number plus m or h (for example 30m or 2h).
  alert_disk_free_pct:
    type: int
    default: 10
    label: "Alert when C: drive free is below (%)"
    description: "Online computers with less free space on C: than this raise a disk alert (1-90)."
  alert_offline_days:
    type: int
    default: 7
    label: Alert when offline for (days)
    description: Alert when a computer that was online goes offline and has not logged on for this many days (1-365).
  alert_patch_age_days:
    type: int
    default: 45
    label: Alert when no update for (days)
    description: Computers with no installed update for longer than this raise a patch alert (1-365).
  alert_privileged_changes:
    type: bool
    default: true
    label: Alert on privileged group additions
    description: Report new members of Domain Admins, Enterprise Admins, Schema Admins, Administrators and your extra privileged groups.
  alert_lockouts:
    type: bool
    default: true
    label: Alert on account lockouts
    description: Report accounts that are locked out.
